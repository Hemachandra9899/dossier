services:
  minio:
    image: quay.io/minio/minio
    container_name: dossier-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: dossier
      MINIO_ROOT_PASSWORD: dossier-local-secret
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: quay.io/minio/mc
    container_name: dossier-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set dossier http://minio:9000 dossier dossier-local-secret;
      /usr/bin/mc mb --ignore-existing dossier/dossier-local;
      echo 'Bucket dossier-local is ready.';
      exit 0;
      "

volumes:
  minio_data:
