services:
  # ──────────────────────────────────────────
  # MinIO (local S3-compatible object storage)
  # ──────────────────────────────────────────
  minio:
    image: quay.io/minio/minio
    container_name: dossier-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: dossier
      MINIO_ROOT_PASSWORD: dossier-local-secret
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: quay.io/minio/mc
    container_name: dossier-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set dossier http://minio:9000 dossier dossier-local-secret;
      /usr/bin/mc mb --ignore-existing dossier/dossier-local;
      echo 'Bucket dossier-local is ready.';
      exit 0;
      "

  # ──────────────────────────────────────────
  # Documenso (local signing engine)
  # Postgres for Documenso's own schema (separate from Dossier's DB)
  # ──────────────────────────────────────────
  documenso-postgres:
    image: postgres:15-alpine
    container_name: dossier-documenso-postgres
    environment:
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: documenso-local-secret
      POSTGRES_DB: documenso
    volumes:
      - documenso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documenso"]
      interval: 5s
      timeout: 5s
      retries: 10

  documenso:
    image: documenso/documenso:latest
    container_name: dossier-documenso
    depends_on:
      documenso-postgres:
        condition: service_healthy
    ports:
      - "3002:3000"
    environment:
      # Internal DB for Documenso itself
      DATABASE_URL: "postgresql://documenso:documenso-local-secret@documenso-postgres:5432/documenso"
      NEXTAUTH_URL: "http://localhost:3002"
      NEXTAUTH_SECRET: "documenso-local-nextauth-secret-change-me"
      NEXT_PUBLIC_WEBAPP_URL: "http://localhost:3002"
      # Required by Documenso - used to sign document certificates
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_CONTENTS: ""
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ""
      # Email (disabled in dev - mails are logged to console)
      NEXT_PRIVATE_SMTP_FROM_NAME: "Documenso Local"
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: "noreply@localhost"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  minio_data:
  documenso_pgdata:
